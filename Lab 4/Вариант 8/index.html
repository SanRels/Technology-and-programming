<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт Умара В-8</title>
    <style>
        html,
        body {
            height: 100%; /**/
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Times New Roman', Times, serif;
            color: black;
            font-size: 24px;
        }

        #box {
            border: 2px solid #6d28d9;
            width: 1000px;
            margin: 0;
            padding: 5px 10px;
            background-color: #ede9fe;
            color: #312e81;
            box-shadow: 0 4px 10px #a78bfa;
            display: flex;
            justify-content: space-around;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background-color: #00FA9A;
            transition: transform 0.3s;
        }
            button:hover {
                transform: translateY(-2px);
                background-color: #00FF7F;
            }
            button:active {
                transform: scale(0.9);
            }

    </style>
</head>
<body>
    <div id="box">
        <button id="fd">Изменить рамку</button>
        <button id="bek">Вернуть рамку</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
